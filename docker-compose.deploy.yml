# 참고용 - FastAPI도 Docker로 돌리고 싶을 때
# 개발 단계에서는 불필요 (로컬 실행이 더 편함)

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coverletter-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coverletter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # FastAPI (선택사항 - 배포 시 사용)
  api:
    build: .
    container_name: coverletter-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app  # 코드 변경 시 자동 반영
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  postgres_data:
